[project]
name = "agentic-codesign"
version = "0.1.0"
description = "Multi-agent infrastructure for agentic hardware-software co-design, with the architect in the loop"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=1.26",
  "scipy>=1.12",
  "z3-solver>=4.12",
  "websockets>=12",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic = "agentic.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic*"]

[tool.setuptools.package-data]
agentic = ["schema/*.json", "ui/static/*", "examples/**/*", "agents/formulator/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
