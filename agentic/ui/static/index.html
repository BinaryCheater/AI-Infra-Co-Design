<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architect console</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<header id="top">
  <div class="brand">ARCHITECT CONSOLE</div>
  <label class="field">run <select id="run-select"></select></label>
  <span id="live-state" class="live-state">recorded</span>
  <button id="btn-back-live" class="ghost" hidden>⇥ back to live</button>
  <span class="spacer"></span>
  <label class="field">speed
    <span class="seg" id="speed-seg">
      <button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="inf">∞</button>
    </span>
  </label>
  <button id="btn-new-run" class="ghost">new run</button>
  <a class="ghost link" href="debug.html" title="the v1 ledger debugger">ledger</a>
</header>

<section id="workload-bar">
  <span class="step-no">Step 1</span>
  <label class="wl-label" for="wl-select">Workload</label>
  <select id="wl-select"></select>
  <span id="wl-desc" class="wl-desc"></span>
</section>

<section id="transport">
  <div class="row">
    <span class="seg">
      <button id="tp-first" title="first iteration">⏮</button><button id="tp-prev" title="previous iteration">◀</button>
      <button id="tp-next" title="next iteration">▶</button><button id="tp-last" title="last iteration">⏭</button>
    </span>
    <button id="tp-run" class="primary">Run</button>
    <button id="tp-pause">Pause</button>
    <button id="tp-step-it">Step iteration</button>
    <button id="tp-step-st">Step station</button>
    <button id="tp-continue">Continue</button>
    <span id="tp-status" class="status"></span>
  </div>
  <div class="row">
    <span class="label">Stop at:</span>
    <span id="breakpoints" class="bps">
      <button data-bp="refuted">bug found</button>
      <button data-bp="regime_flip">bottleneck moved</button>
      <button data-bp="proposed">proposed</button>
      <button data-bp="solved">solved</button>
      <button data-bp="admitted">accepted</button>
    </span>
  </div>
  <div id="scrubber" class="scrubber">
    <div class="track"><div class="ticks" id="ticks"></div><div class="cursor" id="cursor"></div></div>
    <div class="legend"><span class="dot accepted"></span> accepted <span class="dot rejected"></span> rejected
      <span class="dot flip"></span> bottleneck moved <span class="person">☺</span> you acted</div>
  </div>
</section>

<main>
  <section id="map-pane">
    <svg id="map" viewBox="0 0 810 450" preserveAspectRatio="xMidYMid meet" aria-label="the map"></svg>
  </section>
  <aside id="pool-pane">
    <div class="pane-head"><h2>THE POOL</h2><span id="pool-count" class="muted"></span></div>
    <div id="pool"></div>
  </aside>
</main>

<section id="narration-pane">
  <div id="narration-title" class="narration-title"></div>
  <div id="narration" class="narration"></div>
</section>

<aside id="inspector" class="inspector" hidden>
  <div class="inspector-head">
    <div><span id="insp-short" class="short"></span> <span id="insp-id" class="muted mono"></span></div>
    <button id="insp-close" class="ghost">close ✕</button>
  </div>
  <div id="insp-actions" class="insp-actions"></div>
  <div id="insp-body"></div>
</aside>

<aside id="methods-panel" class="inspector methods" hidden>
  <div class="inspector-head">
    <div><span id="mp-title" class="short"></span></div>
    <button id="mp-close" class="ghost">close ✕</button>
  </div>
  <div id="mp-body"></div>
</aside>

<div id="toasts"></div>
<script src="session.js"></script>
<script src="glossary.js"></script>
<script src="narration.js"></script>
<script src="map.js"></script>
<script src="scrubber.js"></script>
<script src="pool.js"></script>
<script src="schedule.js"></script>
<script src="inspector.js"></script>
<script src="transport.js"></script>
<script src="workload.js"></script>
<script src="methods.js"></script>
<script src="console.js"></script>
</body>
</html>
